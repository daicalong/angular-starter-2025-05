<ul class="flex gap-4 items-center p-4 bg-zinc-200 w-full">
    @for (item of routes; track $index) {
        <li>
            <a class="p-2 font-bold" 
            routerLinkActive="text-blue-500"
            [routerLink]="item.path">{{item.title}}</a>
        </li>
    }
</ul>

<router-outlet></router-outlet>
