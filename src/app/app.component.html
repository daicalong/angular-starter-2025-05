<ul class="sticky top-0 z-20 flex gap-4 items-center p-4 bg-gray-200 dark:bg-gray-900 w-full">
    @for (item of routes; track $index) {
    @if(item.title) {
    <li>
        <a class="p-2 font-bold" routerLinkActive="text-blue-500" [routerLink]="item.path">{{item.title}}</a>
    </li>
    }
    }
</ul>

<router-outlet></router-outlet>
